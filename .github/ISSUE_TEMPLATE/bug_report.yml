name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: And what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a focus session
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Arvudoro version
      description: Settings → About
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Linux, macOS, Windows]
    validations:
      required: true
  - type: input
    id: os-detail
    attributes:
      label: OS version and desktop
      placeholder: Ubuntu 24.04, GNOME, Wayland
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
      description: If you run from a terminal, paste its output here.
